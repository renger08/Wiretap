<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Wiretap Activity</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Courier New', monospace;
    cursor:none;
  }
  #screen {
    position:relative;
    width:100vw; height:100vh;
    background: #c9c7bd; /* beige CRT bezel-ish backdrop behind windows */
    overflow:hidden;
  }
  /* Fixed design resolution matching the target monitor (1366x768).
     JS below scales this box to fit whatever window/screen it's shown
     on, so you never need to manually zoom the browser. */
  #app {
    position:absolute;
    top:50%; left:50%;
    width:1366px;
    height:768px;
    transform-origin:center center;
    background: linear-gradient(180deg,#d9d7cd,#c4c2b8);
    border: 2px solid #7a7a72;
    box-shadow: inset 0 0 4px rgba(0,0,0,.4);
    display:flex;
    flex-direction:column;
    font-size: 15px;
  }
  /* top target bar */
  .targetbar {
    display:flex; justify-content:space-between; align-items:center;
    background:#b9b6ab;
    border-bottom:1px solid #7a7a72;
    padding:6px 14px;
    font-size:1.15em;
    color:#1a1a1a;
    font-weight:bold;
    letter-spacing:.5px;
  }
  .targetbar .status { color:#0a5a0a; }

  /* fake column header */
  .colhead {
    display:grid;
    grid-template-columns: 1fr 1fr 1.4fr 1fr .8fr;
    background:#ccc9be;
    border-bottom:1px solid #9a988d;
    font-size:.6em;
    color:#555;
    padding:2px 10px;
    letter-spacing:1px;
  }
  .colhead span:last-child{ text-align:right; }

  .body { flex:1; display:flex; flex-direction:column; padding:10px 12px; gap:10px; }

  .window {
    background:#0b1a3a;
    border:1px solid #050d1f;
    box-shadow: 0 0 0 1px #4a5a86 inset;
    position:relative;
  }
  .titlebar {
    background: linear-gradient(180deg,#5878c0,#2c3f7a);
    color:#fff; font-size:.65em; font-weight:bold;
    padding:2px 6px; display:flex; justify-content:space-between;
    letter-spacing:.5px;
  }
  .titlebar .dots span{
    display:inline-block; width:8px;height:8px; margin-left:3px;
    background:#c9c7bd; border:1px solid #7a7a72;
  }

  .incoming-row {
    display:flex; align-items:center; gap:14px;
    background: linear-gradient(180deg,#16234f,#0b1638);
    padding:10px 14px;
  }
  .incoming-label { color:#fff; font-size:1.3em; font-weight:bold; letter-spacing:1px; }
  .incoming-time { color:#fff; font-size:1.3em; font-weight:bold; letter-spacing:1px; font-variant-numeric: tabular-nums; }

  .digits-panel {
    background:#d7d7d2;
    border-top:1px solid #050d1f;
    padding:10px 16px;
    text-align:center;
  }
  .digits {
    font-size:2.6em;
    letter-spacing:.35em;
    color:#111;
    font-weight:bold;
    font-family:'Courier New', monospace;
  }
  .digits .ghost { color:#b7b6b0; }

  .wave-window { flex:1; min-height:0; display:flex; flex-direction:column; }
  .wave-body { flex:1; display:flex; }
  .wave-gutter {
    width:26px; background:#0b1a3a; border-left:1px solid #050d1f;
    display:flex; flex-direction:column; justify-content:space-around;
    font-size:.55em; color:#7d90c8; text-align:center; padding:4px 0;
  }
  canvas { display:block; width:100%; height:100%; }

  .statusbar {
    display:flex; justify-content:space-between;
    background:#b9b6ab; border-top:1px solid #7a7a72;
    padding:2px 10px; font-size:.55em; color:#444;
  }

  /* CRT overlay effects */
  .crt-overlay {
    pointer-events:none;
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.08) 0px,
      rgba(0,0,0,0.08) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
    opacity:.5;
  }
  .flicker {
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%,96%,100% { opacity:0; }
    97% { opacity:.02; }
    98% { opacity:0; }
    99% { opacity:.015; }
  }

  .label-tag {
    position:absolute;
    bottom:-46px; left:50%; transform:translateX(-50%) rotate(-2deg);
    background:#efe6c8;
    border:1px solid #b0a67e;
    padding:6px 22px;
    font-family: 'Courier New', monospace;
    font-weight:bold;
    font-size:1.1em;
    color:#222;
    box-shadow:1px 2px 3px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="screen">
  <div id="app">
    <div class="targetbar">
      <span>Target: <span id="targetNumber">410.968.1146</span></span>
      <span class="status" id="lineStatus">Payphone Active</span>
    </div>

    <div class="colhead">
      <span>Caller #</span><span>Direction</span><span>Number</span><span>Time</span><span>Status</span>
    </div>

    <div class="body">
      <div class="window">
        <div class="titlebar">
          <span>Wiretap Activity</span>
          <span class="dots"><span></span><span></span><span></span></span>
        </div>
        <div class="incoming-row">
          <span class="incoming-label">Incoming:</span>
          <span class="incoming-time" id="clock">00:00:00</span>
        </div>
        <div class="digits-panel">
          <div class="digits" id="digits"></div>
        </div>
      </div>

      <div class="window wave-window">
        <div class="titlebar">
          <span>Incoming</span>
          <span class="dots"><span></span><span></span><span></span></span>
        </div>
        <div class="wave-body">
          <div class="wave-gutter" id="gutter"></div>
          <canvas id="wave"></canvas>
        </div>
      </div>

      <div class="statusbar">
        <span id="footStatus">IDLE</span>
        <span id="footTime">00:00.00</span>
      </div>
    </div>

    <div class="crt-overlay"></div>
    <div class="flicker"></div>
    <div class="label-tag">EPISODE ONE</div>
  </div>
  <audio id="callAudio" preload="auto"></audio>
  <div id="unlockOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.75);color:#fff;
       font-family:sans-serif;display:flex;align-items:center;justify-content:center;
       font-size:1.4em;z-index:999;cursor:pointer;text-align:center;padding:20px;">
    برای شروع صدا کلیک کن (این پیام فقط توی تست مرورگر معمولی نشون داده میشه)
  </div>
</div>

<script>
// ---------- Config ----------
const TARGET_NUMBER = "410.968.1146";
const LOOP_GAP_MS = 3000;       // idle pause between loops
const DIAL_STEP_MS = 90;        // speed of digits appearing

// Each entry = one caller ID number + its matching recording.
// File paths are relative to wiretap.html (served over http://, not file://).
const CALLS = [
  { number: "3019992486", file: "call1.mp3" },
  { number: "4105551234", file: "call2.mp3" },
  { number: "8005551212", file: "call3.mp3" },
  { number: "6005559686", file: "call4.mp3" },
  { number: "9605553541", file: "call5.mp3" },
  { number: "2505552148", file: "call6.mp3" },
  { number: "7005556542", file: "call7.mp3" },
  { number: "1205556317", file: "call8.mp3" },
  { number: "9005558741", file: "call9.mp3" },
  { number: "4508883247", file: "call10.mp3" },
  { number: "6005552879", file: "call11.mp3" },
  { number: "4102223967", file: "call12.mp3" },
  { number: "2307775129", file: "call13.mp3" },
];

// 'random'     -> picks a random call each loop (never repeats the same
//                 one twice in a row if you have more than one entry)
// 'sequential' -> cycles through the list in order, looping back to start
const CALL_ORDER = 'random';

let lastCallIndex = -1;
function pickNextCall(){
  if (CALLS.length === 1) return CALLS[0];
  if (CALL_ORDER === 'sequential'){
    lastCallIndex = (lastCallIndex + 1) % CALLS.length;
    return CALLS[lastCallIndex];
  }
  let idx;
  do { idx = Math.floor(Math.random() * CALLS.length); }
  while (idx === lastCallIndex);
  lastCallIndex = idx;
  return CALLS[idx];
}

// ---------- Elements ----------
const digitsEl = document.getElementById('digits');
const clockEl = document.getElementById('clock');
const footStatus = document.getElementById('footStatus');
const footTime = document.getElementById('footTime');
const lineStatus = document.getElementById('lineStatus');
const canvas = document.getElementById('wave');
const ctx = canvas.getContext('2d');
const gutter = document.getElementById('gutter');
const audioEl = document.getElementById('callAudio');

for (let i=8; i>=1; i--){
  const s = document.createElement('span');
  s.textContent = i;
  gutter.appendChild(s);
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---------- Auto-fit scaling ----------
// The design is built at a fixed 1366x768 canvas (matching the target
// monitor). This scales that fixed box to fit the actual window/screen,
// so no manual browser zoom is ever needed — on the real kiosk monitor
// at native 1366x768 this naturally lands on scale = 1.
const appEl = document.getElementById('app');
const DESIGN_W = 1366, DESIGN_H = 768;
function fitToScreen(){
  const scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
  appEl.style.transform = `translate(-50%, -50%) scale(${scale})`;
  resizeCanvas();
}
window.addEventListener('resize', fitToScreen);
fitToScreen();

// ---------- Audio ----------
// Ring is synthesized (no external file needed). The call itself plays
// your own recorded file through callAudio, routed through the analyser
// so the waveform panel reacts to your real recording.
let audioCtx, analyser, dataArray, masterGain, fileSource;
function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.0;
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);

  // Hook the <audio> element into the same graph so the waveform
  // reacts to the real recording instead of synthesized noise.
  fileSource = audioCtx.createMediaElementSource(audioEl);
  fileSource.connect(masterGain);
}

function playCallRecording(){
  return new Promise((resolve) => {
    masterGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    audioEl.currentTime = 0;
    audioEl.onended = resolve;
    audioEl.onerror = () => {
      console.error('Could not load call.mp3 — check the filename/path (Linux is case-sensitive) and format.');
      resolve();
    };
    audioEl.play().catch(err => {
      console.warn('Playback blocked or failed:', err.name, err.message);
      resolve();
    });
  });
}

function playRingTone(){
  // classic dual-tone ring approximation
  const now = audioCtx.currentTime;
  [440, 480].forEach(freq=>{
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    g.gain.value = 0.15;
    osc.connect(g); g.connect(masterGain);
    osc.start(now); osc.stop(now+2);
  });
  masterGain.gain.setValueAtTime(0.4, now);
}

function playCallTone(durationSec){
  // ambient line hum + voice-band noise standing in for a call
  const now = audioCtx.currentTime;
  masterGain.gain.setValueAtTime(0.3, now);

  const hum = audioCtx.createOscillator();
  hum.type = 'sine'; hum.frequency.value = 60;
  const humGain = audioCtx.createGain(); humGain.gain.value = 0.03;
  hum.connect(humGain); humGain.connect(masterGain);
  hum.start(now); hum.stop(now+durationSec);

  const bufferSize = audioCtx.sampleRate * durationSec;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * 0.5; }
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;

  const bandpass = audioCtx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 900;
  bandpass.Q.value = 0.7;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.12;

  // slow amplitude modulation to feel like speech cadence
  const lfo = audioCtx.createOscillator();
  lfo.frequency.value = 2.3;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.08;
  lfo.connect(lfoGain);
  lfoGain.connect(noiseGain.gain);
  lfo.start(now); lfo.stop(now+durationSec);

  noise.connect(bandpass); bandpass.connect(noiseGain); noiseGain.connect(masterGain);
  noise.start(now); noise.stop(now+durationSec);
}

// ---------- Waveform rendering ----------
let scrollX = 0;
const history = [];
const MAX_POINTS = 400;

function drawWave(){
  requestAnimationFrame(drawWave);
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // grid
  ctx.strokeStyle = 'rgba(80,110,180,0.25)';
  ctx.lineWidth = 1;
  for (let x=0; x<w; x+=w/20){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
  }

  let level = 0;
  if (analyser){
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for (let i=0;i<dataArray.length;i++){
      const v = (dataArray[i]-128)/128;
      sum += Math.abs(v);
    }
    level = sum/dataArray.length;
  }
  history.push(level);
  if (history.length > MAX_POINTS) history.shift();

  // draw scrolling amplitude trace (orange, like screenshot)
  ctx.strokeStyle = '#e08a3c';
  ctx.lineWidth = 1.5 * devicePixelRatio;
  ctx.beginPath();
  const midY = h*0.5;
  history.forEach((v,i)=>{
    const x = (i/MAX_POINTS)*w;
    const y = midY - v * h * 3.2 * Math.sin(i*0.7 + performance.now()*0.005);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // fainter cyan secondary trace
  ctx.strokeStyle = 'rgba(120,200,255,0.6)';
  ctx.beginPath();
  history.forEach((v,i)=>{
    const x = (i/MAX_POINTS)*w;
    const y = midY + v * h * 2.2 * Math.cos(i*0.5 + performance.now()*0.004);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
drawWave();

// ---------- Clock / timer ----------
let elapsedStart = null;
function tickClock(){
  requestAnimationFrame(tickClock);
  if (elapsedStart === null) return;
  const t = new Date();
  clockEl.textContent = t.toLocaleTimeString('en-GB');
  const elapsed = (performance.now() - elapsedStart)/1000;
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  const cs = String(Math.floor((elapsed*100)%100)).padStart(2,'0');
  footTime.textContent = `${mm}:${ss}.${cs}`;
}
tickClock();

// ---------- Dialing / loop sequence ----------
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function dialDigits(number){
  digitsEl.innerHTML = '';
  const spans = [];
  for (const ch of number){
    const s = document.createElement('span');
    s.textContent = ch;
    s.className = 'ghost';
    digitsEl.appendChild(s);
    spans.push(s);
  }
  for (let i=0;i<spans.length;i++){
    await sleep(DIAL_STEP_MS);
    spans[i].className = '';
  }
}

async function runLoop(){
  while (true){
    footStatus.textContent = 'STANDBY';
    lineStatus.textContent = 'Payphone Active';
    digitsEl.innerHTML = '';
    elapsedStart = null;
    footTime.textContent = '00:00.00';
    await sleep(LOOP_GAP_MS);

    const call = pickNextCall();
    audioEl.src = call.file;
    audioEl.load();

    footStatus.textContent = 'RINGING';
    lineStatus.textContent = 'Incoming Call...';
    playRingTone();
    await sleep(1800);

    footStatus.textContent = 'CONNECTED — RECORDING';
    lineStatus.textContent = 'Payphone Active';
    elapsedStart = performance.now();
    await dialDigits(call.number);

    await playCallRecording();

    footStatus.textContent = 'CALL ENDED';
    await sleep(1500);
  }
}

// Autostart: browsers require a user gesture for audio, but in kiosk mode
// on the Pi/desktop (with --autoplay-policy=no-user-gesture-required) we
// auto-unlock on first paint. As a fallback for normal-browser testing,
// we also unlock on the first click/keypress anywhere on the page.
const unlockOverlay = document.getElementById('unlockOverlay');
let started = false;

function startShow(){
  if (started) return;
  started = true;
  unlockOverlay.style.display = 'none';
  initAudio();
  audioCtx.resume().then(() => {
    console.log('AudioContext state:', audioCtx.state);
  }).catch(err => console.warn('resume() failed:', err));
  runLoop();
}

window.addEventListener('load', () => {
  // Try to start automatically (works in kiosk mode with the autoplay flag).
  initAudio();
  audioCtx.resume().then(() => {
    if (audioCtx.state === 'running') {
      unlockOverlay.style.display = 'none';
      started = true;
      runLoop();
    }
    // If still 'suspended' here, the browser blocked autoplay — the
    // overlay stays visible and we wait for a real user gesture below.
  }).catch(() => {});
});

['click', 'keydown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, startShow, { once: true });
});
</script>
</body>
</html>
